<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - Кондитерская "Сладкая жизнь"</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="location">г.Оренбург</div>
            <div class="logo-main">
                <div class="logo-title">Кондитерская</div>
                <div class="logo-subtitle">"Сладкая жизнь"</div>
            </div>
            <div class="header-right">
                <div class="phone">+7 (922) 852 58 09</div>
                <div class="delivery-date">ближайшая дата<br>для заказа 06.11.2026</div>
                <button class="auth-btn" id="auth-btn-header">Войти</button>
                <button class="cart-icon" id="cart-btn-header">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <span id="cart-count">0</span>
                </button>
            </div>
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Главная</a>
            <a href="torty.html" class="nav-link">Торты</a>
            <a href="pirozhnye.html" class="nav-link">Пирожные</a>
            <a href="vypechka.html" class="nav-link">Выпечка</a>
            <a href="nachinki.html" class="nav-link">Начинки</a>
            <a href="#" class="nav-link">Оплата и доставка</a>
            <a href="#" class="nav-link">О нас</a>
            <a href="#" class="nav-link">Работа в Сладкой жизни</a>
            <a href="#" class="nav-link">Контакты</a>
            <a href="#" class="nav-link">Вопросы/ответы</a>
        </nav>
        <div class="search-container">
            <div class="search-box">
                <input type="text" placeholder="Поиск продукта">
                <button class="search-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>
    <main class="container">
        <div class="section-title-container">
            <h2>Ваша корзина</h2>
            <span class="count-badge" id="cart-items-count">0 товаров</span>
        </div>
        <div id="cart-page-container">
            <div class="cart-page-content">
                <div id="cart-items-list" class="cart-items-list"></div>
                <div class="cart-summary">
                    <div class="cart-total-row">
                        <span>Итого:</span>
                        <span id="cart-total-amount">0₽</span>
                    </div>
                    <button class="checkout-btn" id="checkout-page-btn">Оформить заказ</button>
                </div>
            </div>
        </div>

        <div class="section-title-container" style="margin-top: 50px;">
            <h2>Мои заказы</h2>
        </div>
        <div id="my-orders-list">
            <p style="color:#777;">Загрузка...</p>
        </div>

    </main>
    <footer class="footer-bottom">
        <div class="logo-main">
            <div class="logo-title">Кондитерская</div>
            <div class="logo-subtitle">"Сладкая жизнь"</div>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script src="cart.js"></script>
</body>
</html>
