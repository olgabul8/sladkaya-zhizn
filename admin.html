<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель - Кондитерская "Сладкая жизнь"</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-wrap">
        <h2>Управление заказами</h2>
        <button class="auth-btn" onclick="logout()" style="color: #c94c4c;">Выйти</button>
    </div>
    <div class="admin-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Клиент</th>
                    <th>Телефон</th>
                    <th>Сумма</th>
                    <th>Статус</th>
                    <th>Дата</th>
                </tr>
            </thead>
            <tbody id="orders-table"></tbody>
        </table>
    </div>

    <script src="admin.js"></script>
</body>
</html>
